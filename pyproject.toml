[project]
name = "qbo-metrics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dask>=2026.8.0",
    "h5py>=3.16.0",
    "matplotlib>=3.11.1",
    "netcdf4>=1.7.4",
    "numpy>=2.5.2",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
    "xarray>=2026.7.0",
]

[project.scripts]
qbo-metrics = "qbo_metrics:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
